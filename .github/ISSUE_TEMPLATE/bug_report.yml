name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please remove any API keys from code and logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest script that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback / logs
      render: shell
  - type: input
    id: version
    attributes:
      label: Swarm Kit version
      description: Output of `swarm-kit version`
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model / provider
      placeholder: gpt-4o, anthropic/claude-sonnet-4-5, ollama/llama3, ...
  - type: input
    id: python
    attributes:
      label: Python version and OS
